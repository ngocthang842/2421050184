<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Cách 1: Inline style -->
    <!--color: Quy định màu chữ -->
    <!--background-color: Quy định màu nền -->
    <h1 style="color: blue;background-color:orange ">Bài Style</h1>

    <!-- Cách 2: Internal style -->
    <h2>
        Cách 2 Internal Style
    </h2>
    <h3>
        Không có nhưng
    </h3>
    <style>
        h2{
            color: pink;
            background-color: black;
        }
        h3{
            color: orange;
            background-color:blanchedalmond;
        }
    </style>
    
    <!-- Cách thứ 3: External Style -->
     <h4>Ngọc thắng</h4>
</body>
</html>
