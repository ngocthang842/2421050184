<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <style>
    .khoi-1{
        background-color: aquamarine;
    }
    .khoi-2{
        background-color: blue;
        /* margin truyền 1 giá trị thì sẽ cách xung quanh = giá trị đó */
        /* Nếu có 2 giá trị thì cái đầy là (trên dưới) , cái thứ 2 là (trái phải)*/
        /* Nếu có 4 giá trị thì thứ tự: Trên,phải,dưới,trái*/
        margin: 10px 50px 100px 200px;
    }
    .khoi-3{
        /* padding: làm cho đối tượng đó to nhỏ lên*/
        background-color: pink;
        padding: 10px 50px 100px 200px;
    }
    </style>
    <div class="khoi-1">Khối 1</div>
    <div class="khoi-2">Khối 2</div>
    <div class="khoi-3">Khối 3</div>

    <h2>Ngoc thang

    </h2>
    <style>
        h2{
            color:antiquewhite;
            background-color: blue;
        }
    </style>
    <!--Nếu là id sử dụng dấu # + tên id-->
    <!--Nếu là class sử dụng . + tên id-->
    <!-- Ví dụ ở dưới: #tieude-1 -->
     <h2 id="tieude-1">web 2</h2>
     <h3 class="tieude-2">web 3</h3>
