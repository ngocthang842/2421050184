<html>
    <head>
        <title>Bai 3</title>
    </head>
    <body>
        <marquee>
            <img width="560" height="315" src="../Ảnh/34.png">
        </marquee>
        <!--ol Danh sách có thứ tự-->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
        <!--ul Danh sách không có thứ tự-->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>
        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên:</b><br>
                <!-- Nếu input không có type thì sẽ -->
                <!-- Mặc định là text-->
                <!-- Thuộc tính readonly sử dụng khi -->
                <!-- Không muốn người dùng nhập -->
                <!-- Thông tin vào input -->
                <input type="" placeholder="Họ và tên" >
            </div>
            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <div>
                <b>Mật khẩu:</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>
            <div>
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type="email">
            </div>
            <div>
                <!-- Số đầu tiên: 0-->
                <!-- Số thứ 2: 3,9,8-->
                <!-- 8 số còn lại: 0-9-->
                <b>Số điện thoại</b><br>
                <input type="tel"
                pattern="([0]{1}([3,8,9]{1})([0-9]{8}))">
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam"> Nam <br>
                <input type="radio" name="gioitinh" value="nu"> Nữ <br>
            </div>
            <div>
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="choigame"><br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="nghenhac"><br>
                Thể thao: <input type="checkbox" name="sothich" value="thethao"><br>
            </div>
            <div>
                <b>Trình duyệt web ưa thích</b>
                <select name="browsers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Chrome">Chorme</option>
                    <option value="Opera">Opera</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc cốc">Cốc Cốc</option>
                </select>
            </div>
            <!-- 0 <input type="range" id="a" value="50"> 100  -->

            <div>
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>
            <div>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/OPCaP_kNFmM?si=nqayQfFE2DuVSz5L" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <video controls width="560" height="315">
                    <source src="../Ảnh/clip_401.mp4" type = "video/mp4">
                </video>
                <audio controls>
                    <source src="/anh/23.mp3" type="audio/mp3">
                </audio>
            </div>
        </form>
    </body>
</html>
